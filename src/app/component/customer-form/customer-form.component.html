
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                <div class="mb-3">
                    <label class="form-label"> Name</label>
                    <input type="text" formControlName="name" class="form-control"
                        [ngClass]="{ 'is-invalid': submitted && f['name'].errors }" />
                    <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
                        <div *ngIf="f['name'].errors['required']">First Name is required</div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="text" formControlName="emailAddress" class="form-control"
                        [ngClass]="{ 'is-invalid': submitted && f['emailAddress'].errors }" />
                    <div *ngIf="submitted && f['emailAddress'].errors" class="invalid-feedback">
                        <div *ngIf="f['emailAddress'].errors['required']">Last Name is required</div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contact Information</label>
                    <input type="text" formControlName="contactInformation" class="form-control"
                        [ngClass]="{ 'is-invalid': submitted && f['contactInformation'].errors }" />
                    <div *ngIf="submitted && f['contactInformation'].errors" class="invalid-feedback">
                        <div *ngIf="f['contactInformation'].errors['required']">contactInformation is required</div>
                        <div *ngIf="f['contactInformation'].errors['minlength']">
                            contactInformation must be at least 6 characters
                        </div>
                        <div *ngIf="f['contactInformation'].errors['maxlength']">
                            contactInformation must not exceed 20 characters
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <input type="text" formControlName="address" class="form-control"
                        [ngClass]="{ 'is-invalid': submitted && f['address'].errors }" />
                    <div *ngIf="submitted && f['address'].errors" class="invalid-feedback">
                        <div *ngIf="f['address'].errors['required']">address is required</div>
                        <div *ngIf="f['address'].errors['minlength']">
                            address must be at least 6 characters
                        </div>
                        <div *ngIf="f['address'].errors['maxlength']">
                            address must not exceed 40 characters
                        </div>
                    </div>
                </div>
                <div>
                    <button [disabled]="loading" class="btn btn-primary" label="Save changes to">
                        <span *ngIf="loading" class="spinner-border spinner-border-sm me-1">
                        </span>
                        {{buttonLabel}}
                    </button>
                    <button style="margin-left: 5px;" class="btn btn-primary" (click)="cancelCustomerForm.emit()">
                        cancel
                    </button>
                </div>
            </form>
